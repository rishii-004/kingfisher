# kingfisher — Render Blueprint (Infrastructure as Code)
#
# Deploys the app on Render as a single Docker service (root `Dockerfile`,
# branch `main`): FastAPI backend (Alembic migrations + Uvicorn, internal-only
# on 127.0.0.1:8000) and the React SPA, both served behind Caddy on $PORT.
# Caddy reverse-proxies /api/* to the backend inside the same container, so
# the browser only ever talks to one origin. See deploy/Caddyfile and
# deploy/entrypoint.sh.
#
# The database is NOT provisioned by Render — it's an external PostgreSQL
# (Supabase). When you create the Blueprint you'll be prompted for
# DATABASE_URL (a Supabase connection string); it's pasted straight into the
# service's env (see `sync: false` below). If you ever want Render's managed
# Postgres instead, remove the DATABASE_URL sync entry and re-add the classic
# `databases:` block with a `fromDatabase` reference.
#
# How to deploy:
#   1. Push these changes to GitHub (main branch).
#   2. Render dashboard → New → Blueprint → pick this repo → select this
#      render.yaml. Paste DATABASE_URL (Supabase) and the other values marked
#      `sync: false` when prompted.
#   3. After the first successful deploy, seed the problem catalog once from
#      the Render shell:
#        python -m scripts.seed
#      (Render dashboard → kingfisher → Shell). Idempotent — safe to rerun.
#
# Full walkthrough: docs/RENDER_DEPLOY.md

services:
  # Backend (FastAPI + Alembic + Uvicorn) and frontend (React SPA via Caddy)
  # in one container. See ../Dockerfile.
  - type: web
    name: kingfisher
    runtime: docker
    repo: https://github.com/rishii-004/kingfisher.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free              # free web services spin down after ~15 min idle
    healthCheckPath: /api/v1/health
    envVars:
      # Supabase (or any Postgres) connection string — pasted when creating the
      # Blueprint. Prefer the Session pooler URI (port 5432 on the pooler host)
      # with ?sslmode=require; see docs/RENDER_DEPLOY.md §4.
      - key: DATABASE_URL
        sync: false
      # Generated once at blueprint creation; stored as a Render secret.
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Only needed for direct cross-origin calls to the API (e.g. from
      # another domain, or the Render dashboard's API tester) — normal app
      # traffic is same-origin via Caddy's /api/* proxy.
      - key: CORS_ORIGINS
        sync: false
      # Optional: promote this email to admin on each backend boot once the
      # account has registered (see docs/DATABASE.md).
      - key: INITIAL_ADMIN_EMAIL
        value: ""
      # Default owned-list quota (created + forked) for new users.
      - key: DEFAULT_MAX_LISTS
        value: "30"
